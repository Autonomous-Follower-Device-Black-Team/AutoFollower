<!DOCTYPE HTML><html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <style>
    body {
      min-width: 310px;
    	max-width: 800px;
    	height: 400px;
      margin: 0 auto;
    }
    h2 {
      font-family: Arial;
      font-size: 2.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>AutoFollower Receiver Timing Data</h2>
  <div id="chart-echodiff" class="container"></div>
  <div id="chart-startdiff" class="container"></div>
</body>
<script>
var chartED = new Highcharts.Chart({
  chart:{ renderTo : 'chart-echodiff' },
  title: { text: 'Echo End Time Difference' },
  series: [{
    showInLegend: false,
    data: []
  }],
  plotOptions: {
    line: { animation: false,
      dataLabels: { enabled: false}
    },
    series: { color: '#059e8a' }
  },
  xAxis: { type: 'datetime',
    dateTimeLabelFormats: { second: '%H:%M:%S' }
  },
  yAxis: {
    title: { text: 'Difference (us)' }
    //title: { text: 'Temperature (Fahrenheit)' }
  },
  credits: { enabled: false }
});
setInterval(function ( ) {
  var xhttp = new XMLHttpRequest();
  xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
      var x = (new Date()).getTime(),
          y = parseFloat(this.responseText);
      //console.log(this.responseText);
      if(chartED.series[0].data.length > 40) {
        chartED.series[0].addPoint([x, y], true, true, true);
      } else {
        chartED.series[0].addPoint([x, y], true, false, true);
      }
    }
  };
  xhttp.open("GET", "/echodiff", true);
  xhttp.send();
}, 200) ;

var chartSD = new Highcharts.Chart({
  chart:{ renderTo:'chart-startdiff' },
  title: { text: 'Echo Start Time Difference' },
  series: [{
    showInLegend: false,
    data: []
  }],
  plotOptions: {
    line: { animation: false,
      dataLabels: { enabled: true }
    }
  },
  xAxis: {
    type: 'datetime',
    dateTimeLabelFormats: { second: '%H:%M:%S' }
  },
  yAxis: {
    title: { text: 'Difference(us)' }
  },
  credits: { enabled: false }
});
setInterval(function ( ) {
  var xhttp = new XMLHttpRequest();
  xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
      var x = (new Date()).getTime(),
          y = parseFloat(this.responseText);
      //console.log(this.responseText);
      if(chartSD.series[0].data.length > 40) {
        chartSD.series[0].addPoint([x, y], true, true, true);
      } else {
        chartSD.series[0].addPoint([x, y], true, false, true);
      }
    }
  };
  xhttp.open("GET", "/startdiff", true);
  xhttp.send();
}, 200) ;

</script>
</html>
